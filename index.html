<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030407" />
  <meta name="description" content="กุหลาบนิรันดร์ — กุหลาบสามมิติเชิงภาพยนตร์ที่ถือกำเนิดจากแสงในห้วงจักรวาลที่มืดที่สุด โต้ตอบได้ทุกส่วน" />
  <title>กุหลาบนิรันดร์ — งานชิ้นเอกแห่งธรรมชาติ</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@200;300;400;500&family=Playfair+Display:ital@1&family=Trirong:ital,wght@0,300;0,400;0,500;1,300&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ LOADING EXPERIENCE ============ -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__halo" aria-hidden="true"></div>
    <div class="loader__inner">
      <p class="loader__eyebrow">การบานดิจิทัลเชิงภาพยนตร์</p>

      <h1 class="loader__title" aria-label="กุหลาบนิรันดร์">
        <span class="loader__word" aria-hidden="true">
          <span style="--i:0">กุ</span><span style="--i:1">หลาบ</span>
        </span>
        <span class="loader__word loader__word--accent" aria-hidden="true">
          <span style="--i:2">นิ</span><span style="--i:3">รั</span><span style="--i:4">น</span><span style="--i:5">ด</span><span style="--i:6">ร์</span>
        </span>
      </h1>

      <div class="loader__line" aria-hidden="true">
        <span class="loader__fill" id="loaderFill"></span>
        <span class="loader__streak"></span>
      </div>

      <div class="loader__meta">
        <span id="loaderStatus">กำลังปลุกการบาน</span>
        <span id="loaderPercent" class="loader__percent">000</span>
      </div>

      <div class="loader__error" id="loaderError" hidden>
        <p id="loaderErrorText"></p>
        <button id="retryBtn" class="cta cta--small" type="button">
          <span class="cta__text">ลองอีกครั้ง</span>
          <span class="cta__shine" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ 3D STAGE ============ -->
  <canvas id="scene" aria-label="กุหลาบสามมิติโต้ตอบได้ คลิกที่ดอกเพื่อคลื่นแสง คลิกพื้นหลังเพื่อวงแหวนพลังงาน"></canvas>

  <!-- Atmosphere overlays -->
  <div class="atmos atmos--vignette" aria-hidden="true"></div>
  <div class="atmos atmos--grain" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- ============ USER INTERFACE ============ -->
  <div class="ui" id="ui">
    <header class="topbar">
      <a class="brand" href="#" aria-label="กุหลาบนิรันดร์" onclick="return false;">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 29.5V17.5" />
            <path d="M16 23.5c-3.2 0-5.4-1.8-6.4-4.2 3.1-.2 5.4 1.2 6.4 4.2z" />
            <path d="M16 17.5c-4.6 0-7.4-3-7.4-7.2 0-2.2.9-4 2.1-5.2 1 2.1 3 3.2 5.3 3.2s4.3-1.1 5.3-3.2c1.2 1.2 2.1 3 2.1 5.2 0 4.2-2.8 7.2-7.4 7.2z" />
            <path d="M16 8.6c-1.6 1-2.2 2.6-1.6 4.1.7 1.7 2.8 1.9 3.5.4.6-1.4-.6-2.5-1.9-2.1" />
          </g>
        </svg>
        <span class="brand__text">กุหลาบ <em>นิรันดร์</em></span>
      </a>

      <nav class="controls" aria-label="ปุ่มควบคุมประสบการณ์">
        <button id="soundBtn" class="ctrl" type="button" aria-pressed="false" aria-label="สลับเสียง">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="ctrl__label">เสียง</span>
          <span class="ctrl__state" id="soundState">ปิด</span>
        </button>
        <button id="fullscreenBtn" class="ctrl" type="button" aria-pressed="false" aria-label="สลับโหมดเต็มจอ">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
              <path d="M1.5 5.5v-4h4" /><path d="M10.5 1.5h4v4" /><path d="M14.5 10.5v4h-4" /><path d="M5.5 14.5h-4v-4" />
            </g>
          </svg>
          <span class="ctrl__label" id="fsLabel">เต็มจอ</span>
        </button>
        <button id="shotBtn" class="ctrl" type="button" aria-label="บันทึกรูปวินาทีนี้">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5.8 4.2l.9-1.4h2.6l.9 1.4h3v8.4H2.8V4.2z" />
              <circle cx="8" cy="8.3" r="2.1" />
            </g>
          </svg>
          <span class="ctrl__label">ถ่ายภาพ</span>
        </button>
        <button id="macroBtn" class="ctrl" type="button" aria-pressed="false" aria-label="ซูมเข้าไปที่ใจกลางดอกกุหลาบ">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7" cy="7" r="4.4" />
              <path d="M10.4 10.4L14 14" />
              <path d="M7 5.2v3.6M5.2 7h3.6" />
            </g>
          </svg>
          <span class="ctrl__label" id="macroLabel">มาโคร</span>
        </button>
        <button id="cinemaBtn" class="ctrl" type="button" aria-pressed="false" aria-label="สลับโหมดภาพยนตร์">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1.8" y="4.2" width="12.4" height="7.6" rx="1" />
              <path d="M4.4 4.2v7.6M7 4.2v7.6M9.6 4.2v7.6M12.2 4.2v7.6" />
            </g>
          </svg>
          <span class="ctrl__label">ภาพยนตร์</span>
        </button>
      </nav>
    </header>

    <div class="eyebrow" id="eyebrow">
      <span class="eyebrow__line" aria-hidden="true"></span>
      <span class="eyebrow__text">งานชิ้นเอกแห่งธรรมชาติ</span>
      <span class="eyebrow__line" aria-hidden="true"></span>
    </div>

    <aside class="phase" id="phase" aria-live="polite">
      <span class="phase__num" id="phaseNum">01</span>
      <div class="phase__body">
        <span class="phase__name" id="phaseName">กำเนิดจากอนุภาค</span>
        <div class="phase__track" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
    </aside>

    <aside class="hint" id="hint">แตะกุหลาบ &nbsp;·&nbsp; จิ้มความมืด &nbsp;·&nbsp; ลากเพื่อหมุน</aside>

    <nav class="themes" id="themes" aria-label="โทนสีช่อดอก">
      <button class="themes__dot is-active" type="button" data-theme="0" style="--c:#e0243e" aria-label="ทับทิมนิรันดร์"></button>
      <button class="themes__dot" type="button" data-theme="1" style="--c:#ff9ab4" aria-label="อรุณชมพู"></button>
      <button class="themes__dot" type="button" data-theme="2" style="--c:#f2e4c4" aria-label="งาช้างเรืองจันทร์"></button>
      <button class="themes__dot" type="button" data-theme="3" style="--c:#5f7cff" aria-label="กำมะหยี่เที่ยงคืน"></button>
    </nav>

    <section class="story" id="story">
      <h2 class="story__title">
        <span class="line"><span>แฮ็กรักเนย</span></span>
        <span class="line"><span><em>ที่สุดในโลกกกกก</em></span></span>
      </h2>
      <p class="story__sub">แม้ในห้วงจักรวาลมืดที่สุด ความรักก็หาทางออกดอกได้เสมอ</p>
      <button id="replayBtn" class="cta" type="button">
        <span class="cta__text">ให้บานอีกครั้ง</span>
        <span class="cta__shine" aria-hidden="true"></span>
      </button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="curtain" id="curtain" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">กุหลาบนิรันดร์ต้องการ JavaScript เพื่อบาน</div>
  </noscript>

  <!-- ============ LIBRARIES (CDN) ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- ============ EXPERIENCE ============ -->
  <script src="script.js"></script>
</body>
</html>
